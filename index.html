<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Maquettes</title>
  <style>
    :root { --bg:#0f1115; --card:#1a1d24; --text:#e8eaed; --muted:#9aa0aa; --accent:#4f8cff; --border:#2a2e37; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); line-height:1.6; padding:2.5rem 1.25rem; }
    .wrap { max-width:760px; margin:0 auto; }
    header { margin-bottom:2.5rem; }
    h1 { font-size:1.9rem; letter-spacing:-0.02em; }
    .sub { color:var(--muted); margin-top:.35rem; }
    .grid { display:grid; gap:1rem; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); }
    a.card { display:block; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:1.25rem; text-decoration:none; color:inherit; transition:border-color .15s, transform .15s; }
    a.card:hover { border-color:var(--accent); transform:translateY(-2px); }
    a.card .name { font-weight:600; }
    a.card .path { color:var(--muted); font-size:.85rem; margin-top:.25rem; word-break:break-all; }
    .empty { color:var(--muted); border:1px dashed var(--border); border-radius:14px; padding:2rem; text-align:center; }
    footer { margin-top:3rem; color:var(--muted); font-size:.8rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Maquettes</h1>
      <p class="sub">Aperçus des projets clients</p>
    </header>

    <div class="grid">
      <!-- Ajoute une carte par maquette. Duplique ce bloc : -->
      <a class="card" href="./dr-roch-mader/">
        <div class="name">Dr Roch Mader</div>
        <div class="path">Chirurgien orthopédiste — Grenoble</div>
      </a>
      <a class="card" href="./dr-vincent-staquet/">
        <div class="name">Dr Vincent Staquet</div>
        <div class="path">Chirurgien pied &amp; cheville — Grenoble</div>
      </a>
      <a class="card" href="./dr-kevin-bargoin/">
        <div class="name">Dr Kevin Bargoin</div>
        <div class="path">Chirurgien épaule &amp; membre supérieur — Nantes</div>
      </a>
      <a class="card" href="./exemple-client/">
        <div class="name">Exemple Client</div>
        <div class="path">exemple-client/</div>
      </a>
    </div>

    <footer>Mis à jour automatiquement à chaque publication.</footer>
  </div>
</body>
</html>
